{% extends "base.html" %}
{% block content %}
<div class="container hero" style="justify-content: center;margin-top: 100px;">
    <div class="card" style="width: 100%; text-align: center; padding: 40px;">
        <h2 class="hero-title" style="font-size: 32px; margin-bottom: 20px;">Welcome to Sage AI</h2>
        <p class="muted" style="margin-bottom: 30px;">Sign in securely with Google to generate intelligent study notes.
        </p>

        <button id="btnGoogleLogin" class="btn primary large" style="width: 100%; justify-content: center; gap: 12px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4" />
                <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853" />
                <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    fill="#FBBC05" />
                <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335" />
            </svg>
            Sign in with Google
        </button>
        <div id="loginError" style="color: var(--bad); margin-top: 15px; font-weight: bold;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";

    // PASTE YOUR FIREBASE CONFIG HERE:
    const firebaseConfig = {
        apiKey: "AIzaSyB0vDTVo_Hap4UavGQN7f9FGa3fKw5DGvg",
        authDomain: "sage-ai-811f8.firebaseapp.com",
        projectId: "sage-ai-811f8",
        storageBucket: "sage-ai-811f8.firebasestorage.app",
        messagingSenderId: "1021990622734",
        appId: "1:1021990622734:web:60222d99dd74148e488e5f",
        measurementId: "G-WF1HTVFN1P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const analytics = getAnalytics(app);

    document.getElementById("btnGoogleLogin").addEventListener("click", async () => {
        const btn = document.getElementById("btnGoogleLogin");
        const errBox = document.getElementById("loginError");

        btn.disabled = true;
        btn.innerHTML = "Signing in... <span class='spinner sm'></span>";
        errBox.textContent = "";

        try {
            const result = await signInWithPopup(auth, provider);
            const token = await result.user.getIdToken();

            // Send the secured token to our python backend to log in
            const response = await fetch("{{ url_for('api_auth_google') }}", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token })
            });

            const data = await response.json();
            if (!response.ok || !data.ok) throw new Error(data.error || "Authentication failed on server");
            window.location.href = "{{ url_for('dashboard') }}";
        } catch (error) {
            errBox.textContent = "Sign in failed: " + error.message;
            btn.disabled = false;
            btn.innerHTML = "Sign in with Google";
        }
    });
</script>
{% endblock %}
